plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.5'
    }

    // Optional own signing key (fork): TVHOME_KEYSTORE, TVHOME_KEYSTORE_PASSWORD, TVHOME_KEY_ALIAS and
    // TVHOME_KEY_PASSWORD from the environment. Without TVHOME_KEYSTORE the release build keeps upstream's
    // debug key, so upstream CI and other machines are unaffected.
    signingConfigs {
        if (System.getenv('TVHOME_KEYSTORE')) {
            own {
                storeFile file(System.getenv('TVHOME_KEYSTORE'))
                storePassword System.getenv('TVHOME_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TVHOME_KEY_ALIAS') ?: 'tvhome'
                keyPassword System.getenv('TVHOME_KEY_PASSWORD') ?: System.getenv('TVHOME_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.findByName('own') ?: signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
